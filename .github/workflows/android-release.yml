name: Android APK

# Builds a signed PBLOCK.apk and publishes it as a GitHub Release. Three ways:
#  1. Bump AndroidVersion/VERSION (e.g. 1.2.0) and push to main -> release v1.2.0
#     (any other Android change on main just makes a test build artifact).
#  2. Push a tag like v1.2.0.
#  3. Actions tab -> Run workflow, with a version (empty = test build only).
on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'AndroidVersion/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.2.0 (empty = test build, no release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AndroidVersion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME, licenses accepted);
      # AGP downloads any missing platform/build-tools itself.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - uses: gradle/actions/setup-gradle@v4

      - name: Use repo signing key from secrets if configured
        env:
          KEYSTORE_B64: ${{ secrets.PBLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PBLOCK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          PBLOCK_KEYSTORE_PASSWORD: ${{ secrets.PBLOCK_KEYSTORE_PASSWORD }}
          PBLOCK_KEY_ALIAS: ${{ secrets.PBLOCK_KEY_ALIAS }}
          PBLOCK_KEY_PASSWORD: ${{ secrets.PBLOCK_KEY_PASSWORD }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Empty secrets must not override the defaults in build.gradle
          [ -z "$PBLOCK_KEYSTORE_PASSWORD" ] && unset PBLOCK_KEYSTORE_PASSWORD
          [ -z "$PBLOCK_KEY_ALIAS" ] && unset PBLOCK_KEY_ALIAS
          [ -z "$PBLOCK_KEY_PASSWORD" ] && unset PBLOCK_KEY_PASSWORD
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export VERSION_NAME="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            export VERSION_NAME="${INPUT_VERSION#v}"
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -f VERSION ] \
               && ! git ls-remote --exit-code --tags origin "v$(tr -d '[:space:]' < VERSION)" >/dev/null; then
            export VERSION_NAME="$(tr -d '[:space:]' < VERSION)"
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          else
            export VERSION_NAME="0.0.${GITHUB_RUN_NUMBER}-dev"
          fi
          export VERSION_CODE="$((100 + GITHUB_RUN_NUMBER))"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/PBLOCK.apk "PBLOCK-${VERSION_NAME}.apk"
          ls -la *.apk
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: PBLOCK-apk
          path: AndroidVersion/PBLOCK-*.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: PBLOCK ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: AndroidVersion/PBLOCK-*.apk
          body: |
            **Install:** download `PBLOCK-*.apk` on your phone and open it.
            **Lock mode (can't be removed without factory reset):** see [docs/LOCK_MODE.md](https://github.com/${{ github.repository }}/blob/main/docs/LOCK_MODE.md).
