name: Android APK

# Push a tag like v1.0.0 -> builds a signed PBLOCK.apk and attaches it to a GitHub Release.
# Can also be run by hand from the Actions tab (APK is then uploaded as a run artifact).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AndroidVersion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Use repo signing key from secrets if configured
        env:
          KEYSTORE_B64: ${{ secrets.PBLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PBLOCK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          PBLOCK_KEYSTORE_PASSWORD: ${{ secrets.PBLOCK_KEYSTORE_PASSWORD }}
          PBLOCK_KEY_ALIAS: ${{ secrets.PBLOCK_KEY_ALIAS }}
          PBLOCK_KEY_PASSWORD: ${{ secrets.PBLOCK_KEY_PASSWORD }}
        run: |
          # Empty secrets must not override the defaults in build.gradle
          [ -z "$PBLOCK_KEYSTORE_PASSWORD" ] && unset PBLOCK_KEYSTORE_PASSWORD
          [ -z "$PBLOCK_KEY_ALIAS" ] && unset PBLOCK_KEY_ALIAS
          [ -z "$PBLOCK_KEY_PASSWORD" ] && unset PBLOCK_KEY_PASSWORD
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            export VERSION_NAME="0.0.${GITHUB_RUN_NUMBER}-dev"
          fi
          export VERSION_CODE="$((100 + GITHUB_RUN_NUMBER))"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/PBLOCK.apk "PBLOCK-${VERSION_NAME}.apk"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PBLOCK-apk
          path: AndroidVersion/PBLOCK-*.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: AndroidVersion/PBLOCK-*.apk
          body: |
            **Install:** download `PBLOCK-*.apk` on your phone and open it.
            **Lock mode (can't be removed without factory reset):** see [docs/LOCK_MODE.md](https://github.com/${{ github.repository }}/blob/main/docs/LOCK_MODE.md).
