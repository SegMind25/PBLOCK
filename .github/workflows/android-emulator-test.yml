name: Android emulator test

# Boots a real Android 14 emulator, installs PBLOCK, turns protection on, restarts the
# phone several times and checks protection comes back (normal mode, Always-on VPN,
# lock mode), plus Search Shield and the Private DNS backup filter.
on:
  push:
    branches: [main]
    paths:
      - 'AndroidVersion/**'
      - '.github/scripts/**'
      - '.github/workflows/android-emulator-test.yml'
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: AndroidVersion
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/emulator-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: emulator-results/
